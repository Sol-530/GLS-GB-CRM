<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLS GB · CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#16161A;
  --bg2:#1C1C21;
  --bg3:#222228;
  --bg4:#2A2A32;
  --bg5:#32323C;
  --text:#EEEEF0;
  --text2:#B0B0BC;
  --text3:#72727E;
  --text4:#3A3A46;
  --border:#2A2A34;
  --border2:#36363F;
  --blue:#3B6EE8;
  --blue2:#2F5DD4;
  --blue3:#6B95F0;
  --blue-bg:rgba(59,110,232,.1);
  --blue-bg2:rgba(59,110,232,.16);
  --blue-text:#93B4F8;
  --danger:#E05252;
  --danger-bg:rgba(224,82,82,.1);
  --danger-text:#F29898;
  --danger-border:rgba(224,82,82,.2);
  --success:#3BAC7A;
  --success-bg:rgba(59,172,122,.1);
  --success-text:#7DD4AC;
  --warn:#D4893A;
  --warn-bg:rgba(212,137,58,.1);
  --warn-text:#F0B878;
  --radius:6px;
  --radius-lg:10px;
  --radius-xl:14px;
  --shadow:0 1px 3px rgba(0,0,0,.35);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --sidebar-w:215px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.auth-logo-icon{width:42px;height:42px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center}
.auth-logo-icon i{font-size:22px;color:#fff}
.auth-brand{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.auth-sub{font-size:12px;color:var(--text3);margin-top:3px}
.auth-err{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border);border-radius:var(--radius);padding:10px 13px;font-size:13px;margin-bottom:16px;display:none}
.auth-err.show{display:block}

/* APP SHELL */
.app{display:flex;flex-direction:column;height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo i{font-size:16px;color:#fff}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.brand-sep{width:1px;height:14px;background:var(--border2);margin:0 6px}
.brand-sub{font-size:12px;color:var(--text3)}
.header-r{display:flex;gap:6px;align-items:center}
.user-chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);padding:5px 12px;background:var(--bg3);border-radius:20px;border:1px solid var(--border)}
.user-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}

/* SIDEBAR */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:10px 8px;display:flex;flex-direction:column;gap:1px;flex-shrink:0;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text4);letter-spacing:.1em;text-transform:uppercase;padding:16px 10px 5px}
.nav-section:first-child{padding-top:8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;color:var(--text3);border:none;background:none;width:100%;text-align:left;transition:all .12s;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--blue-bg2);color:var(--blue-text);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--blue);border-radius:0 2px 2px 0}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--bg4);color:var(--text3);padding:2px 7px;border-radius:20px}
.nav-item.active .nav-badge{background:var(--blue-bg2);color:var(--blue-text)}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
.content{max-width:1000px;margin:0 auto}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .12s;font-family:inherit;line-height:1}
.btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue2);border-color:var(--blue2)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-danger{color:var(--danger-text);border-color:var(--danger-border)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-full{width:100%;justify-content:center;padding:11px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text3)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}

/* BADGES */
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;line-height:1.4}
.bd-blue{background:var(--blue-bg);color:var(--blue-text)}
.bd-gray{background:var(--bg3);color:var(--text3)}
.bd-amber{background:var(--warn-bg);color:var(--warn-text)}
.bd-red{background:var(--danger-bg);color:var(--danger-text)}
.bd-green{background:var(--success-bg);color:var(--success-text)}
.bd-purple{background:rgba(139,92,246,.12);color:#C4B5FD}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg2)}
.card-head-l{display:flex;align-items:center;gap:10px}
.card-body{padding:16px 18px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;margin-bottom:5px;transition:all .12s}
.list-item:hover{border-color:var(--border2);background:var(--bg3)}

/* AVATARS */
.av{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.av-r{border-radius:50%}
.av-lg{width:44px;height:44px;border-radius:10px;font-size:15px}
.av-b{background:rgba(59,110,232,.18);color:#93B4F8}
.av-t{background:rgba(59,172,122,.15);color:#7DD4AC}
.av-a{background:rgba(212,137,58,.15);color:#F0B878}
.av-c{background:rgba(224,82,82,.15);color:#F29898}
.av-g{background:var(--bg4);color:var(--text2)}
.av-p{background:rgba(139,92,246,.15);color:#C4B5FD}

/* INFO ROWS */
.sl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.ir{display:flex;gap:10px;padding:5px 0;font-size:13px;align-items:flex-start}
.ik{color:var(--text3);width:88px;flex-shrink:0;font-size:12px;font-weight:500;padding-top:1px}
.iv{color:var(--text);flex:1;word-break:break-all;line-height:1.5}
.iv-link{color:var(--blue3)}
.divider{height:1px;background:var(--border);margin:14px 0}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue)}
.metric-label{font-size:10px;color:var(--text3);margin-bottom:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.metric-val{font-size:30px;font-weight:700;color:var(--text);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.metric-val.danger{color:var(--danger)}
.metric-val.success{color:var(--success)}

/* ALERT CARDS */
.alert-card{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:6px;cursor:pointer;transition:all .12s}
.alert-card:hover{border-color:var(--border2);background:var(--bg3)}
.alert-card.overdue{border-left:2px solid var(--danger);border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.today{border-left:2px solid var(--warn);border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.upcoming{border-left:2px solid var(--blue);border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.done{border-left:2px solid var(--success);border-radius:0 var(--radius-lg) var(--radius-lg) 0;opacity:.4}

/* TIMELINE */
.tl-item{display:flex;gap:12px;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-lw{display:flex;flex-direction:column;align-items:center;width:18px;flex-shrink:0}
.tl-dot{width:11px;height:11px;border-radius:50%;margin-top:3px;flex-shrink:0;border:2px solid}
.tl-dot-past{background:var(--bg4);border-color:var(--text4)}
.tl-dot-cur{background:rgba(59,172,122,.2);border-color:var(--success)}
.tl-dot-next{background:var(--blue-bg);border-color:var(--blue)}
.tl-dot-done{background:rgba(59,172,122,.2);border-color:var(--success)}
.tl-vline{width:1px;background:var(--border2);flex:1;min-height:12px;margin-top:4px}
.tl-c{flex:1;min-width:0}
.tl-date{font-size:11px;color:var(--text3);margin-bottom:2px;font-weight:500}
.tkind{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-block;margin-top:4px}
.kind-past{background:var(--bg4);color:var(--text3)}
.kind-current{background:rgba(59,172,122,.15);color:var(--success-text)}
.kind-next{background:var(--blue-bg);color:var(--blue-text)}
.kind-done{background:rgba(59,172,122,.15);color:var(--success-text)}

/* CHIP */
.chip{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;margin-bottom:5px;transition:all .12s}
.chip:hover{border-color:var(--border2);background:var(--bg4)}

/* FORMS */
.field-label{font-size:12px;color:var(--text2);margin-bottom:5px;margin-top:12px;font-weight:500}
.field-label:first-of-type{margin-top:0}
input[type=text],input[type=date],input[type=email],input[type=password],input[type=search],select,textarea{
  width:100%;padding:9px 12px;font-size:13px;
  border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--bg3);color:var(--text);font-family:inherit;outline:none;
  transition:border-color .12s,box-shadow .12s;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,232,.12)}
input::placeholder{color:var(--text4)}
select option{background:var(--bg3);color:var(--text)}
textarea{resize:vertical;min-height:60px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
.search-wrap input{padding-left:36px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border-radius:var(--radius-xl);border:1px solid var(--border2);padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:18px;color:var(--text);letter-spacing:-.02em}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.acc-ck-list{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;max-height:110px;overflow-y:auto}
.acc-ck-list label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer;color:var(--text2)}
.acc-ck-list label:hover{color:var(--text)}

/* ACTION FORM */
.act-form{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-top:12px}
.act-form .field-label{margin-top:10px}
.act-form .field-label:first-of-type{margin-top:0}

/* PAGE */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;margin-bottom:14px;font-weight:500;font-family:inherit;transition:color .12s}
.back-btn:hover{color:var(--blue3)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:20px}
.section-head:first-child{margin-top:0}
.empty{text-align:center;padding:3rem 2rem;font-size:13px;color:var(--text3);line-height:2}
.empty i{display:block;font-size:36px;margin-bottom:10px;color:var(--text4)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);padding:11px 18px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;opacity:0;transition:all .2s;pointer-events:none;z-index:200;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateY(-3px)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:var(--bg)}
.spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* CHECKBOX */
.act-check{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border2);background:var(--bg3);cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;transition:all .12s}
.act-check:hover{border-color:var(--blue)}
.act-check.checked{background:var(--blue);border-color:var(--blue)}

/* CALENDAR */
.cal-layout{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}
.cal-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow)}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.cal-title{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.cal-grid{display:table;table-layout:fixed;width:100%;border-collapse:collapse}
.cal-grid-row{display:table-row}
.cal-dow{display:table-cell;text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:10px 4px;letter-spacing:.07em;text-transform:uppercase;background:var(--bg3);width:14.2857%}
.cal-cell{display:table-cell;width:14.2857%;height:90px;max-height:90px;border-top:1px solid var(--border);border-right:1px solid var(--border);padding:6px;vertical-align:top;overflow:hidden;box-sizing:border-box;transition:background .1s;cursor:pointer}
.cal-cell:last-child{border-right:none}
.cal-cell:hover{background:var(--bg3)}
.cal-day-num{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:3px;flex-shrink:0;line-height:1;display:block}
.cal-day-num.today-num{width:22px;height:22px;background:var(--blue);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.cal-day-num.other-month{color:var(--text4)}
.cal-events-wrap{overflow:hidden;max-height:66px;display:flex;flex-direction:column;gap:2px}
.cal-event{font-size:9.5px;font-weight:600;padding:2px 5px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;flex-shrink:0}
.ev-next{background:var(--blue-bg);color:var(--blue-text)}
.ev-current{background:rgba(59,172,122,.15);color:var(--success-text)}
.ev-overdue{background:var(--danger-bg);color:var(--danger-text)}
.ev-done{background:var(--bg4);color:var(--text4);text-decoration:line-through}

/* SIDEBAR PANEL */
.act-sidebar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow)}
.act-sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--text);background:var(--bg3)}
.act-sidebar-item{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.act-sidebar-item:last-child{border-bottom:none}
.act-sidebar-item:hover{background:var(--bg3)}

/* ADMIN */
.user-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.user-card-info{display:flex;align-items:center;gap:10px}
.user-av{width:36px;height:36px;border-radius:50%;background:var(--blue-bg);color:var(--blue-text);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.admin-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--blue);color:#fff;margin-left:6px}

/* UPLOAD */
.upload-zone{border:1px dashed var(--border2);border-radius:var(--radius-xl);padding:2.5rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg2)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:var(--blue-bg)}
.upload-zone i{font-size:36px;color:var(--text3);display:block;margin-bottom:10px;transition:color .15s}
.upload-zone:hover i{color:var(--blue3)}

/* PRINT */
@media print{
  .sidebar,.header,.btn,.back-btn,.modal-overlay,.toast,.no-print{display:none!important}
  .main{padding:0!important;background:#fff!important}
  .content{max-width:100%!important}
  body{background:#fff!important;color:#000!important}
  .card,.list-item,.metric,.alert-card{background:#fff!important;border:1px solid #ddd!important;box-shadow:none!important}
  .app{height:auto!important}.body{overflow:visible!important}.main{overflow:visible!important}
  .cal-layout{grid-template-columns:1fr 240px!important}
}
@media(max-width:700px){
  .sidebar{display:none}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .cal-layout{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div><div style="font-size:13px;color:var(--text3)">Connecting...</div></div>
<div class="auth-wrap" id="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo"><div class="auth-logo-icon"><i class="ti ti-briefcase"></i></div><div><div class="auth-title">GLS GB &middot; CRM</div><div class="auth-sub">Global Business Management</div></div></div>
    <div class="auth-err" id="auth-err"></div>
    <div class="field-label" style="margin-top:0">Email</div>
    <input type="email" id="login-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="field-label" style="margin-top:10px">Password</div>
    <input type="password" id="login-pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="doLogin()"><i class="ti ti-login"></i> Sign In</button>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:16px">Access restricted to authorised accounts only.</div>
  </div>
</div>
<div class="app" id="app-wrap" style="display:none">
  <div class="header no-print">
    <div class="brand"><div class="brand-logo"><i class="ti ti-briefcase"></i></div><div><span class="brand-name">GLS GB</span><span class="brand-sep"></span><span class="brand-sub">CRM</span></div></div>
    <div class="header-r">
      <div class="user-chip"><div class="user-dot"></div><span id="user-email-display"></span></div>

<div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,getDocs,onSnapshot,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FB_CFG={apiKey:"AIzaSyBeKJhlrZa0QO53vGEECQ_Op_Yzg5QIIJ4",authDomain:"gls-bd-crm.firebaseapp.com",projectId:"gls-bd-crm",storageBucket:"gls-bd-crm.firebasestorage.app",messagingSenderId:"1099159791944",appId:"1:1099159791944:web:5b6d934f80012f85f96b7d"};
const fbApp=initializeApp(FB_CFG);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

/* ── constants & utils ─────────────────────────────── */
const CC={b:'av-b',t:'av-t',a:'av-a',c:'av-c',g:'av-g',p:'av-p'};
const COLS=['b','t','a','c','g','p'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

function uid(){return Math.random().toString(36).slice(2,9)}
function ini(s){return(s||'?').split(/\s+/).map(function(w){return w[0]}).join('').toUpperCase().slice(0,2)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function daysFrom(d){return Math.floor((new Date(d)-new Date(todayStr()))/864e5)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
function showErr(msg){var e=document.getElementById('auth-err');e.textContent=msg;e.classList.add('show')}
function clearErr(){var e=document.getElementById('auth-err');if(e)e.classList.remove('show')}

/* ── state ─────────────────────────────────────────── */
var currentUser=null,isAdmin=false;
var DB={accounts:{},leads:{}};
var unsubAcc=null,unsubLeads=null,unsubTeam=null;
var S={tab:'dashboard',view:'list',accId:null,leadId:null,fromAcc:null,calYear:new Date().getFullYear(),calMonth:new Date().getMonth(),leadSearch:'',accSearch:'',tcYear:new Date().getFullYear(),tcMonth:new Date().getMonth(),contactFilter:'all'};

/* ── auth ──────────────────────────────────────────── */
onAuthStateChanged(auth,async function(user){
  document.getElementById('loading').style.display='none';
  if(user){
    var ud=await getDoc(doc(db,'users',user.uid));
    if(!ud.exists()){await signOut(auth);document.getElementById('auth-wrap').style.display='flex';showErr('Access denied. Contact your administrator.');return;}
    currentUser=user;isAdmin=ud.data().role==='admin';
    document.getElementById('user-email-display').textContent=user.email;
    document.getElementById('admin-btn').style.display=isAdmin?'':'none';
    document.getElementById('auth-wrap').style.display='none';
    document.getElementById('app-wrap').style.display='flex';
    startListeners();
  }else{
    currentUser=null;isAdmin=false;stopListeners();
    document.getElementById('app-wrap').style.display='none';
    document.getElementById('auth-wrap').style.display='flex';
  }
});

window.doLogin=async function(){
  clearErr();
  var email=document.getElementById('login-email').value.trim();
  var pw=document.getElementById('login-pw').value;
  if(!email||!pw){showErr('Please enter email and password.');return}
  try{await signInWithEmailAndPassword(auth,email,pw);}
  catch(e){
    if(['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].indexOf(e.code)>-1)showErr('Invalid email or password.');
    else if(e.code==='auth/too-many-requests')showErr('Too many attempts. Try again later.');
    else showErr('Sign-in failed. Please try again.');
  }
};
window.doLogout=async function(){await signOut(auth);};

/* ── firestore ─────────────────────────────────────── */
function startListeners(){
  unsubAcc=onSnapshot(collection(db,'accounts'),function(snap){DB.accounts={};snap.forEach(function(d){DB.accounts[d.id]=Object.assign({},d.data(),{id:d.id})});render();});
  unsubLeads=onSnapshot(collection(db,'leads'),function(snap){DB.leads={};snap.forEach(function(d){DB.leads[d.id]=Object.assign({},d.data(),{id:d.id})});render();});
}
function stopListeners(){if(unsubAcc)unsubAcc();if(unsubLeads)unsubLeads();if(unsubTeam)unsubTeam();}
function accs(){return Object.values(DB.accounts)}
function leads(){return Object.values(DB.leads)}

/* ── render ────────────────────────────────────────── */
function render(){
  var el=document.getElementById('main-content');if(!el)return;
  updateBadges();
  var addBtn=document.getElementById('add-main-btn');
  var addLabel=document.getElementById('add-label');
  document.querySelectorAll('.nav-item[data-tab]').forEach(function(n){n.classList.toggle('active',n.dataset.tab===S.tab)});
  if(S.view==='acc_detail'){addBtn.style.display='none';el.innerHTML=renderAccDetail();}
  else if(S.view==='lead_detail'){addBtn.style.display='none';el.innerHTML=renderLeadDetail();}
  else{
    if(S.tab==='accounts'){addBtn.style.display='';addLabel.textContent='Add Account';}
    else if(S.tab==='leads'){addBtn.style.display='';addLabel.textContent='Add Lead';}
    else addBtn.style.display='none';
    if(S.tab==='dashboard')el.innerHTML=renderDashboard();
    else if(S.tab==='contacts')el.innerHTML=renderContacts();
    else if(S.tab==='calendar')el.innerHTML=renderCalendar();
    else if(S.tab==='teamcal')el.innerHTML=renderTeamCalendar();
    else if(S.tab==='accounts')el.innerHTML=renderAccList();
    else if(S.tab==='leads')el.innerHTML=renderLeadList();
    else if(S.tab==='import')el.innerHTML=renderImport();
    else if(S.tab==='admin'){renderAdminAsync(el);return;}
  }
  attachEvents();
}

function updateBadges(){
  document.getElementById('nb-acc').textContent=accs().length;
  document.getElementById('nb-leads').textContent=leads().length;
}

function getAlerts(){
  var out=[];
  leads().forEach(function(l){
    (l.actions||[]).forEach(function(act){
      if(act.kind==='past')return;
      var diff=daysFrom(act.date);
      var u=act.done?'done':diff<0?'overdue':diff===0?'today':diff<=7?'upcoming':null;
      if(u)out.push({lead:l,action:act,urgency:u,diff:act.done?9999:diff});
    });
  });
  return out.sort(function(a,b){return a.diff-b.diff});
}

/* ── dashboard ─────────────────────────────────────── */
function renderDashboard(){
  var alerts=getAlerts();
  var pending=alerts.filter(function(a){return a.urgency!=='done'});
  var done=alerts.filter(function(a){return a.urgency==='done'});
  var ov=pending.filter(function(a){return a.urgency==='overdue'}).length;
  var totalAct=leads().reduce(function(s,l){return s+(l.actions||[]).length},0);
  var urgBadge={overdue:'bd-red',today:'bd-amber',upcoming:'bd-blue',done:'bd-green'};
  var urgLabel={overdue:'Overdue',today:'Due today',upcoming:'This week',done:'Done'};

  function mkCard(item){
    var lead=item.lead,action=item.action,urgency=item.urgency;
    var accNames=(lead.accounts||[]).map(function(id){return DB.accounts[id]&&DB.accounts[id].name}).filter(Boolean).join(', ')||'Unlinked';
    var diff=daysFrom(action.date);
    var dl=action.done?'Completed':urgency==='overdue'?Math.abs(diff)+'d overdue':urgency==='today'?'Today':diff===1?'Tomorrow':'In '+diff+'d';
    return '<div class="alert-card '+urgency+'" data-goto-lead="'+esc(lead.id)+'">'
      +'<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0">'
      +'<div class="av av-r '+(CC[lead.color]||'av-g')+'" style="width:28px;height:28px;font-size:10px">'+ini(lead.name)+'</div>'
      +'<div class="act-check '+(action.done?'checked':'')+'" data-toggle="'+esc(lead.id)+'|'+esc(action.id)+'" onclick="event.stopPropagation()">'
      +(action.done?'<i class="ti ti-check" style="font-size:10px;color:var(--bg)"></i>':'')+'</div></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
      +'<span style="font-size:13px;font-weight:600">'+esc(lead.name)+'</span>'
      +'<span class="badge '+urgBadge[urgency]+'">'+urgLabel[urgency]+'</span></div>'
      +'<div style="font-size:12px;color:var(--text2);margin-top:1px">'+esc(accNames)+'</div>'
      +'<div style="font-size:13px;margin-top:4px;'+(action.done?'text-decoration:line-through;color:var(--text3)':'')+'">'+(action.text||'')+'</div></div>'
      +'<div style="font-size:12px;font-weight:500;color:var(--text2);text-align:right;flex-shrink:0">'+dl+'<br><span style="font-size:11px;color:var(--text3)">'+esc(action.date)+'</span></div></div>';
  }

  var pHTML=pending.length?pending.map(mkCard).join(''):'<div style="padding:12px;text-align:center;font-size:13px;color:var(--text3);background:var(--bg2);border-radius:var(--radius)">No pending actions — all clear ✓</div>';
  // work type counts
  var tevAll=Object.values(DB.teamEvents||{});
  var wtCounts={'Premove Survey':0,'Meeting':0,'Move':0,'Document':0};
  tevAll.forEach(function(e){if(wtCounts.hasOwnProperty(e.workType))wtCounts[e.workType]++;});
  var wtColors={'Premove Survey':'#185FA5','Meeting':'#0F6E56','Move':'#854F0B','Document':'#993C1D'};
  var wtBg={'Premove Survey':'#E6F1FB','Meeting':'#E1F5EE','Move':'#FAEEDA','Document':'#FAECE7'};
  var wtGrid=Object.keys(wtCounts).map(function(wt){return'<div class="metric" style="border-left:3px solid '+wtColors[wt]+';padding:12px 14px"><div class="metric-label" style="color:'+wtColors[wt]+'">'+wt+'</div><div class="metric-val">'+wtCounts[wt]+'</div></div>';}).join('')+'</div>'

  var rLeads=leads().slice(-10).reverse();
  return '<div class="page-header"><div class="page-title">Dashboard</div><div style="font-size:12px;color:var(--text3)">'+new Date().toLocaleDateString('en-GB',{weekday:'short',year:'numeric',month:'short',day:'numeric'})+'</div></div>'
    +'<div class="metric-grid">'
    +'<div class="metric"><div class="metric-label">Accounts</div><div class="metric-val">'+accs().length+'</div></div>'
    +'<div class="metric"><div class="metric-label">Leads</div><div class="metric-val">'+leads().length+'</div></div>'
    +'<div class="metric"><div class="metric-label">Actions logged</div><div class="metric-val">'+totalAct+'</div></div>'
    +'<div class="metric"><div class="metric-label">Overdue</div><div class="metric-val '+(ov?'danger':'')+'">'+ov+'</div></div></div>'
    +'<div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;margin-top:2px">Team Events</div>'
    +'<div class="metric-grid">'+wtGrid+'</div>'
    +'<div class="section-head"><div class="sl" style="margin:0">Pending actions ('+pending.length+') <span style="font-size:11px;color:var(--text3);font-weight:400">— click ☐ to mark done</span></div></div>'
    +pHTML
    +(done.length?'<div class="section-head"><div class="sl" style="margin:0;color:var(--text3)">Completed ('+done.length+')</div></div>'+done.map(mkCard).join(''):'')
    +'<div class="section-head" style="margin-top:20px"><div class="sl" style="margin:0">Recently added leads</div><button class="btn btn-sm" data-tab="leads">View all</button></div>'
    +'<div style="max-height:300px;overflow-y:auto">'
    +rLeads.map(function(l){
      var an=(l.accounts||[]).map(function(id){return DB.accounts[id]&&DB.accounts[id].name}).filter(Boolean).join(', ')||'Unlinked';
      var p=(l.actions||[]).filter(function(a){return a.kind!=='past'&&!a.done});
      return '<div class="list-item" data-goto-lead="'+esc(l.id)+'">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<div class="av av-r '+(CC[l.color]||'av-g')+'">'+ini(l.name)+'</div>'
        +'<div><div style="display:flex;align-items:center;gap:6px"><span style="font-size:14px;font-weight:500">'+esc(l.name)+'</span>'+(p.length?'<span class="badge bd-amber">'+p.length+' pending</span>':'')+'</div>'
        +'<div style="font-size:12px;color:var(--text2)">'+esc(l.position||'')+(l.position&&an?' · ':'')+esc(an)+'</div></div></div>'
        +'<i class="ti ti-chevron-right" style="font-size:15px;color:var(--text3)"></i></div>';
    }).join('');+'</div>'
}

/* ── calendar ────────────────────────────────────────── */
function renderCalendar(){
  var y=S.calYear,m=S.calMonth;
  var firstDay=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var dip=new Date(y,m,0).getDate();
  var tf=todayStr();
  var pfx=y+'-'+String(m+1).padStart(2,'0');
  var events={},allActs=[];
  leads().forEach(function(l){
    (l.actions||[]).forEach(function(act){
      if(!act.date||!act.date.startsWith(pfx))return;
      if(!events[act.date])events[act.date]=[];
      events[act.date].push({lead:l,action:act});
      allActs.push({lead:l,action:act,date:act.date});
    });
  });
  allActs.sort(function(a,b){return a.date<b.date?-1:1});

  var dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var dowRow='<tr class="cal-grid-row">'+dows.map(function(dw){return'<th class="cal-dow">'+dw+'</th>'}).join('')+'</tr>';

  // Build cells grouped into rows of 7
  var allCells=[];
  for(var i=firstDay-1;i>=0;i--){
    allCells.push('<td class="cal-cell"><div class="cal-day-num other-month">'+(dip-i)+'</div><div class="cal-events-wrap"></div></td>');
  }
  for(var d=1;d<=dim;d++){
    var ds=pfx+'-'+String(d).padStart(2,'0');
    var isT=ds===tf;
    var evs=events[ds]||[];
    var dayNumHtml=isT
      ?'<span class="cal-day-num today-num">'+d+'</span>'
      :'<span class="cal-day-num">'+d+'</span>';
    var evH=evs.slice(0,3).map(function(item){
      var cls=item.action.done?'ev-done':daysFrom(ds)<0?'ev-overdue':item.action.kind==='current'?'ev-current':'ev-next';
      return '<div class="cal-event '+cls+'" title="'+esc(item.lead.name)+': '+esc(item.action.text)+'">'+esc(item.lead.name)+'</div>';
    }).join('');
    if(evs.length>3)evH+='<div style="font-size:9px;color:var(--text3)">+'+(evs.length-3)+' more</div>';
    allCells.push('<td class="cal-cell">'+dayNumHtml+'<div class="cal-events-wrap">'+evH+'</div></td>');
  }
  // Pad to complete last row
  while(allCells.length%7!==0){
    var nd=allCells.length-firstDay-(dim-1);
    allCells.push('<td class="cal-cell"><div class="cal-day-num other-month">'+(nd+1)+'</div><div class="cal-events-wrap"></div></td>');
  }
  // Group into rows
  var rows='';
  for(var r=0;r<allCells.length;r+=7){
    rows+='<tr class="cal-grid-row">'+allCells.slice(r,r+7).join('')+'</tr>';
  }

  var sideItems=allActs.length?allActs.map(function(item){
    var diff=daysFrom(item.date);
    var color=item.action.done?'var(--text3)':diff<0?'var(--danger-text)':diff===0?'var(--warn-text)':'var(--info-text)';
    var bg=item.action.done?'var(--bg3)':diff<0?'var(--danger-bg)':diff===0?'var(--warn-bg)':'var(--info-bg)';
    return '<div class="act-sidebar-item">'
      +'<div class="act-check '+(item.action.done?'checked':'')+'" data-toggle="'+esc(item.lead.id)+'|'+esc(item.action.id)+'" style="margin-top:1px">'
      +(item.action.done?'<i class="ti ti-check" style="font-size:10px;color:var(--bg)"></i>':'')+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:12px;font-weight:500;color:'+color+';'+(item.action.done?'text-decoration:line-through':'')+'">'+(item.action.text||'')+'</div>'
      +'<div style="font-size:11px;color:var(--text2);margin-top:1px">'+esc(item.lead.name)+' · '+esc(item.date)+'</div>'
      +'<div style="display:inline-block;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px;background:'+bg+';color:'+color+';margin-top:2px">'+(item.action.kind==='past'?'Past':item.action.kind==='current'?'Current':'Follow-up')+'</div>'
      +'</div></div>';
  }).join(''):'<div class="empty">No actions this month.</div>';

  return '<div class="page-header"><div class="page-title">'+MN[m]+' '+y+'</div>'
    +'<div style="display:flex;gap:6px" class="no-print">'
    +'<button class="btn btn-sm" id="cal-prev"><i class="ti ti-chevron-left"></i></button>'
    +'<button class="btn btn-sm" id="cal-today">Today</button>'
    +'<button class="btn btn-sm" id="cal-next"><i class="ti ti-chevron-right"></i></button>'
    +'</div></div>'
    +'<div class="cal-layout">'
    +'<div class="cal-wrap">'
    +'<div class="cal-header"><div class="cal-title">'+MN[m]+' '+y+'</div><div style="font-size:12px;color:var(--text3)">'+allActs.length+' action'+(allActs.length!==1?'s':'')+'</div></div>'
    +'<table class="cal-grid"><thead>'+dowRow+'</thead><tbody>'+rows+'</tbody></table>'
    +'</div>'
    +'<div class="act-sidebar"><div class="act-sidebar-head">Actions in '+MN[m]+'</div>'+sideItems+'</div>'
    +'</div>';
}

/* ── account list ─────────────────────────────────────── */
function renderAccList(){
  var q=S.accSearch.toLowerCase().trim();
  var all=accs();
  var list=q?all.filter(function(a){
    return (a.name||'').toLowerCase().indexOf(q)>-1
      ||(a.type||'').toLowerCase().indexOf(q)>-1
      ||(a.pic||'').toLowerCase().indexOf(q)>-1
      ||(a.address||'').toLowerCase().indexOf(q)>-1
      ||(a.comment||'').toLowerCase().indexOf(q)>-1;
  }):all;

  var h='<div class="page-header"><div class="page-title">Accounts</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="btn btn-sm btn-danger" id="bulk-del-acc-btn" style="display:none"><i class="ti ti-trash"></i> Delete selected (<span id="bulk-acc-count">0</span>)</button>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer"><input type="checkbox" id="sel-all-acc" style="width:14px;height:14px;cursor:pointer"> Select all</label>'
    +'</div></div>'
    +'<div class="search-wrap"><i class="ti ti-search"></i><input type="search" id="acc-search" placeholder="Search by name, type, PIC, address..." value="'+esc(S.accSearch)+'"></div>';

  if(!list.length){
    h+=q?'<div class="empty">No results for &ldquo;'+esc(S.accSearch)+'&rdquo;</div>':'<div class="empty">No accounts yet.</div>';
    return h;
  }
  h+=list.map(function(a){
    return '<div class="list-item" data-acc="'+esc(a.id)+'">'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<input type="checkbox" class="ck-acc" value="'+esc(a.id)+'" style="width:15px;height:15px;cursor:pointer;flex-shrink:0" onclick="event.stopPropagation()">'
      +'<div class="av '+(CC[a.color]||'av-g')+'">'+ini(a.name)+'</div>'
      +'<div><div style="font-size:14px;font-weight:500">'+esc(a.name)+'</div><div style="font-size:12px;color:var(--text2)">'+esc(a.type||'')+' · '+esc(a.pic||'—')+'</div></div></div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span class="badge bd-blue">'+(a.leads||[]).length+' lead'+((a.leads||[]).length!==1?'s':'')+'</span>'
      +'<i class="ti ti-chevron-right" style="font-size:15px;color:var(--text3)"></i></div></div>';
  }).join('');
  return h;
}

/* ── lead list ─────────────────────────────────────── */
function renderLeadList(){
  var q=S.leadSearch.toLowerCase().trim();
  var all=leads();
  var filtered=q?all.filter(function(l){
    return (l.name||'').toLowerCase().indexOf(q)>-1
      ||(l.company||'').toLowerCase().indexOf(q)>-1
      ||(l.position||'').toLowerCase().indexOf(q)>-1
      ||(l.email||'').toLowerCase().indexOf(q)>-1
      ||(l.comment||'').toLowerCase().indexOf(q)>-1;
  }):all;

  var linked=filtered.filter(function(l){return(l.accounts||[]).length>0});

  function row(l){
    var an=(l.accounts||[]).map(function(id){return DB.accounts[id]&&DB.accounts[id].name}).filter(Boolean).join(', ')||'Unlinked';

  var h='<div class="page-header"><div class="page-title">Leads</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="btn btn-sm btn-danger" id="bulk-del-lead-btn" style="display:none"><i class="ti ti-trash"></i> Delete selected (<span id="bulk-lead-count">0</span>)</button>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer"><input type="checkbox" id="sel-all-lead" style="width:14px;height:14px;cursor:pointer"> Select all</label>'
    +'</div></div>'

  if(q&&!filtered.length){
    h+='<div class="empty">No results for &ldquo;'+esc(S.leadSearch)+'&rdquo;</div>';
    return h;

  if(linked.length){h+='<div style="font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px">Linked leads</div>'+linked.map(row).join('');}

  if(!linked.length&&!unlinked.length)h+='<div class="empty">No leads yet.</div>';
  return h;
}

/* ── import helpers ────────────────────────────────── */
var importRows=[];
function processFile(file){
  var ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){var r=new FileReader();r.onload=function(e){parseCSV(e.target.result)};r.readAsText(file,'utf-8');}
  else if(ext==='xlsx'||ext==='xls'){var r2=new FileReader();r2.onload=function(e){parseXLSX(e.target.result)};r2.readAsArrayBuffer(file);}
  else toast('Please upload .csv, .xlsx, or .xls');
}
function parseCSV(text){
  var lines=text.trim().split(/\r?\n/);
  if(lines.length<2){toast('File is empty.');return;}
  var headers=lines[0].split(',').map(function(h){return h.trim().replace(/^"|"$/g,'').toLowerCase()});
  var rows=lines.slice(1).map(function(line){
    var vals=[],cur='',inq=false;
    for(var i=0;i<line.length;i++){if(line[i]==='"')inq=!inq;else if(line[i]===','&&!inq){vals.push(cur.trim());cur='';}else cur+=line[i];}
    vals.push(cur.trim());
    var obj={};headers.forEach(function(h,i){obj[h]=(vals[i]||'').trim();});
    return obj;
  }).filter(function(r){return r.name});
  showPreview(rows);
}
function parseXLSX(buf){
  if(!window.XLSX){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=function(){doXLSX(buf)};document.head.appendChild(s);}
  else doXLSX(buf);
}
function doXLSX(buf){
  try{
    var wb=XLSX.read(buf,{type:'arraybuffer'});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var json=XLSX.utils.sheet_to_json(ws,{defval:''});
    var rows=json.map(function(r){var o={};Object.keys(r).forEach(function(k){o[k.toLowerCase().trim()]=String(r[k]).trim();});return o;}).filter(function(r){return r.name});
    showPreview(rows);
  }catch(e){toast('Failed to read Excel file.');}
}
function showPreview(rows){
  importRows=rows;
  var existing=new Set(leads().map(function(l){return l.email&&l.email.toLowerCase()}).filter(Boolean));
  var preview=document.getElementById('import-preview');
  var tbl=document.getElementById('preview-table');
  if(!preview||!tbl)return;
  preview.style.display='';
  var fields=['name','company','position','email','phone','address','comment'];
  tbl.innerHTML='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:var(--bg2)">'+fields.map(function(f){return'<th style="padding:7px 10px;text-align:left;border:.5px solid var(--border);font-weight:500;color:var(--text2);text-transform:uppercase;font-size:10px">'+f+'</th>'}).join('')+'<th style="padding:7px 10px;border:.5px solid var(--border)">Status</th></tr></thead><tbody>'+rows.map(function(r){var skip=existing.has((r.email||'').toLowerCase());return'<tr style="'+(skip?'opacity:.45':'')+'">'+fields.map(function(f){return'<td style="padding:6px 10px;border:.5px solid var(--border)">'+esc(r[f]||'—')+'</td>'}).join('')+'<td style="padding:6px 10px;border:.5px solid var(--border)">'+(skip?'<span class="badge bd-gray">Skip</span>':'<span class="badge bd-green">New</span>')+'</td></tr>'}).join('')+'</tbody></table></div>';
  toast(rows.length+' rows found. Review and confirm.');
}
async function autoLink(companyName){
  if(!companyName)return[];
  var match=accs().find(function(a){return a.name.trim().toLowerCase()===companyName.trim().toLowerCase()});
  if(!match){
    var obj={name:companyName.trim(),type:'Company',pic:'',email:'',phone:'',address:'',comment:'Auto-created from lead',color:COLS[Math.floor(Math.random()*COLS.length)],leads:[]};
    var r=await addDoc(collection(db,'accounts'),obj);
    match=Object.assign({},obj,{id:r.id});DB.accounts[r.id]=match;
    toast('Account "'+companyName+'" auto-created.');
  }
  return[match.id];
}
async function confirmImport(){
  var existing=new Set(leads().map(function(l){return l.email&&l.email.toLowerCase()}).filter(Boolean));
  var count=0;
  for(var i=0;i<importRows.length;i++){
    var r=importRows[i];
    if(existing.has((r.email||'').toLowerCase()))continue;
    var accountIds=await autoLink(r.company||'');
    var lr=await addDoc(collection(db,'leads'),{name:r.name||'',company:r.company||'',position:r.position||'',email:r.email||'',phone:r.phone||'',address:r.address||'',comment:r.comment||'',color:COLS[Math.floor(Math.random()*COLS.length)],accounts:accountIds,actions:[]});
    if(accountIds.length){var acc=DB.accounts[accountIds[0]];if(acc)await updateDoc(doc(db,'accounts',accountIds[0]),{leads:(acc.leads||[]).concat([lr.id])});}
    count++;
  }
  toast(count+' lead'+(count!==1?'s':'')+' imported.');
  importRows=[];S.tab='leads';S.view='list';render();
}

    var d=data||{};
    body.innerHTML='<div class="modal-title">'+(type==='add_account'?'New Account':'Edit Account')+'</div>'
      +'<div class="field-label">Company name *</div><input id="f-name" type="text" value="'+esc(d.name||'')+'">'
      +'<div class="field-label">Type</div><input id="f-type" type="text" placeholder="Company / Exhibition / KOICA / etc." value="'+esc(d.type||'')+'">'
      +'<div class="field-label">Person in charge (PIC)</div><input id="f-pic" type="text" value="'+esc(d.pic||'')+'">'
      +'<div class="field-label">Email</div><input id="f-email" type="text" value="'+esc(d.email||'')+'">'
      +'<div class="field-label">Phone</div><input id="f-phone" type="text" value="'+esc(d.phone||'')+'">'
      +'<div class="field-label">Address</div><input id="f-address" type="text" value="'+esc(d.address||'')+'">'
      +'<div class="field-label">Comment</div><textarea id="f-comment">'+esc(d.comment||'')+'</textarea>'
      +'<div class="modal-footer"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>';
    document.getElementById('m-cancel').onclick=closeModal;
    document.getElementById('m-save').onclick=async function(){
      var name=document.getElementById('f-name').value.trim();if(!name){alert('Company name is required.');return;}
      var obj={name:name,type:document.getElementById('f-type').value.trim(),pic:document.getElementById('f-pic').value.trim(),email:document.getElementById('f-email').value.trim(),phone:document.getElementById('f-phone').value.trim(),address:document.getElementById('f-address').value.trim(),comment:document.getElementById('f-comment').value.trim(),color:(data&&data.color)||COLS[Math.floor(Math.random()*COLS.length)],leads:(data&&data.leads)||[]};
      if(type==='add_account'){var r=await addDoc(collection(db,'accounts'),obj);S.accId=r.id;}
      else{await updateDoc(doc(db,'accounts',data.id),obj);S.accId=data.id;}
      closeModal();if(type==='edit_account')S.view='acc_detail';else{S.tab='accounts';S.view='list';}
      toast('Account saved.');
    };
  } else if(type==='add_lead'||type==='edit_lead'){
    var d2=data||{};
    var selIds=d2.accounts||[];
    var checks=accs().map(function(a){return'<label><input type="checkbox" class="acc-ck" value="'+esc(a.id)+'" '+(selIds.indexOf(a.id)>-1?'checked':'')+'>'+esc(a.name)+'</label>'}).join('');
    body.innerHTML='<div class="modal-title">'+(type==='add_lead'?'New Lead':'Edit Lead')+'</div>'
      +'<div class="field-label">Full name *</div><input id="f-name" type="text" value="'+esc(d2.name||'')+'">'
      +'<div class="field-label">Company</div><input id="f-company" type="text" value="'+esc(d2.company||'')+'">'
      +'<div class="field-label">Position</div><input id="f-position" type="text" value="'+esc(d2.position||'')+'">'
      +'<div class="field-label">Email</div><input id="f-email" type="text" value="'+esc(d2.email||'')+'">'
      +'<div class="field-label">Phone</div><input id="f-phone" type="text" value="'+esc(d2.phone||'')+'">'
      +'<div class="field-label">Address</div><input id="f-address" type="text" value="'+esc(d2.address||'')+'">'
      +'<div class="field-label">Comment</div><textarea id="f-comment">'+esc(d2.comment||'')+'</textarea>'
      +'<div class="field-label">Link to Accounts</div>'
      +'<div class="acc-ck-list">'+(checks||'<span style="font-size:12px;color:var(--text3)">No accounts yet</span>')+'</div>'
      +'<div class="modal-footer"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>';
    document.getElementById('m-cancel').onclick=closeModal;
    document.getElementById('m-save').onclick=async function(){
      var name=document.getElementById('f-name').value.trim();if(!name){alert('Name is required.');return;}
      var selAccIds=Array.from(document.querySelectorAll('.acc-ck:checked')).map(function(el){return el.value});
      var companyName=document.getElementById('f-company').value.trim();
      var obj={name:name,company:companyName,position:document.getElementById('f-position').value.trim(),email:document.getElementById('f-email').value.trim(),phone:document.getElementById('f-phone').value.trim(),address:document.getElementById('f-address').value.trim(),comment:document.getElementById('f-comment').value.trim(),color:(data&&data.color)||COLS[Math.floor(Math.random()*COLS.length)],accounts:selAccIds,actions:(data&&data.actions)||[]};
      var leadId=data&&data.id;
      if(type==='add_lead'){var r=await addDoc(collection(db,'leads'),obj);leadId=r.id;}
      else await updateDoc(doc(db,'leads',data.id),obj);
      if(companyName){var autoIds=await autoLink(companyName);autoIds.forEach(function(id){if(selAccIds.indexOf(id)===-1)selAccIds.push(id);});}
      for(var i=0;i<accs().length;i++){
        var a=accs()[i];
        var had=(a.leads||[]).indexOf(leadId)>-1,has=selAccIds.indexOf(a.id)>-1;
        if(has&&!had)await updateDoc(doc(db,'accounts',a.id),{leads:(a.leads||[]).concat([leadId])});
        if(!has&&had)await updateDoc(doc(db,'accounts',a.id),{leads:(a.leads||[]).filter(function(x){return x!==leadId})});
      }
      var curAcc=(await getDoc(doc(db,'leads',leadId))).data();
      if(JSON.stringify((curAcc&&curAcc.accounts||[]).sort())!==JSON.stringify(selAccIds.slice().sort()))await updateDoc(doc(db,'leads',leadId),{accounts:selAccIds});
      closeModal();S.leadId=leadId;
      if(type==='edit_lead')S.view='lead_detail';else{S.tab='leads';S.view='list';}
      toast('Lead saved.');
    };
  }
}

var USER_COLORS=['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#06B6D4','#84CC16'];

async function getUserColor(){
  if(!currentUser)return USER_COLORS[0];
  try{
    var ud=await getDoc(doc(db,'users',currentUser.uid));
    if(ud.exists()&&ud.data().calColor)return ud.data().calColor;
  }catch(e){}
  return USER_COLORS[0];
}

async function saveUserColor(color){
  if(!currentUser)return;
  await updateDoc(doc(db,'users',currentUser.uid),{calColor:color});
}

function renderTeamCalendar(){
  var y=S.tcYear,m=S.tcMonth;
  var firstDay=new Date(y,m,1).getDay();
  var dim=new Date(y,m+1,0).getDate();
  var dip=new Date(y,m,0).getDate();
  var tf=todayStr();
  var pfx=y+'-'+String(m+1).padStart(2,'0');

  // Collect team events from Firestore (stored in 'teamEvents' collection)
  // We'll use DB.teamEvents which is populated by listener
  var tevents=DB.teamEvents||{};
  var events={};
  var allActs=[];
  Object.values(tevents).forEach(function(ev){
    if(!ev.date||!ev.date.startsWith(pfx))return;
    if(!events[ev.date])events[ev.date]=[];
    events[ev.date].push(ev);
    allActs.push(ev);
  });
  allActs.sort(function(a,b){return a.date<b.date?-1:1});

  var dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var dowRow='<tr class="cal-grid-row">'+dows.map(function(dw){return'<th class="cal-dow">'+dw+'</th>'}).join('')+'</tr>';

  var allCells=[];
  for(var i=firstDay-1;i>=0;i--){
    allCells.push('<td class="cal-cell"><div class="cal-day-num other-month">'+(dip-i)+'</div><div class="cal-events-wrap"></div></td>');
  }
  for(var d=1;d<=dim;d++){
    var ds=pfx+'-'+String(d).padStart(2,'0');
    var isT=ds===tf;
    var evs=events[ds]||[];
    var dayNumHtml=isT?'<span class="cal-day-num today-num">'+d+'</span>':'<span class="cal-day-num">'+d+'</span>';
    var evH=evs.slice(0,3).map(function(ev){
      var bg=ev.userColor||'#3B82F6';
      var txt=ev.name||(ev.workType||'');
      return '<div class="cal-event" style="background:'+esc(bg)+'22;color:'+esc(bg)+';border-left:2px solid '+esc(bg)+'" title="'+esc(ev.userEmail||'')+': '+esc(txt)+'">'+esc(txt)+'</div>';
    }).join('');
    if(evs.length>3)evH+='<div style="font-size:9px;color:var(--text3)">+'+(evs.length-3)+' more</div>';
    allCells.push('<td class="cal-cell" data-tc-date="'+esc(ds)+'">'+dayNumHtml+'<div class="cal-events-wrap">'+evH+'</div></td>');
  }
  while(allCells.length%7!==0){
    var nd=allCells.length-firstDay-dim+1;
    allCells.push('<td class="cal-cell"><div class="cal-day-num other-month">'+nd+'</div><div class="cal-events-wrap"></div></td>');
  }
  var rows='';
  for(var r=0;r<allCells.length;r+=7){
    rows+='<tr class="cal-grid-row">'+allCells.slice(r,r+7).join('')+'</tr>';
  }

  // sidebar list
  var sideItems=allActs.length?allActs.map(function(ev){
    var bg=ev.userColor||'#3B82F6';
    return '<div class="act-sidebar-item">'
      +'<div style="width:10px;height:10px;border-radius:50%;background:'+esc(bg)+';flex-shrink:0;margin-top:3px"></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:12px;font-weight:500;color:var(--text)">'+esc(ev.name||'—')+'</div>'
      +'<div style="font-size:11px;color:var(--text2);margin-top:1px">'+esc(ev.workType||'')+' · '+esc(ev.date)+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:1px">'+esc(ev.accountType==='private'?'Private Clients':ev.companyName||'')+' · '+esc(ev.userEmail||'')+'</div>'
      +'</div>'
      +'<button class="btn btn-sm btn-danger" data-del-tcev="'+esc(ev.id)+'" style="padding:2px 7px;font-size:11px"><i class="ti ti-x" style="font-size:11px"></i></button>'
      +'</div>';
  }).join(''):'<div class="empty">No events this month.</div>';

  // color picker row
  var colorPicker=USER_COLORS.map(function(c){
    return '<div data-pick-color="'+esc(c)+'" style="width:22px;height:22px;border-radius:50%;background:'+esc(c)+';cursor:pointer;border:2px solid transparent;flex-shrink:0" title="'+esc(c)+'"></div>';
  }).join('');

  return '<div class="page-header"><div class="page-title">Team Calendar</div>'
    +'<div style="display:flex;gap:6px;align-items:center" class="no-print">'
    +'<button class="btn btn-sm" id="tc-prev"><i class="ti ti-chevron-left"></i></button>'
    +'<button class="btn btn-sm" id="tc-today">Today</button>'
    +'<button class="btn btn-sm" id="tc-next"><i class="ti ti-chevron-right"></i></button>'
    +'<button class="btn btn-sm btn-primary" id="tc-add-btn"><i class="ti ti-plus"></i> Add Event</button>'
    +'</div></div>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg)">'
    +'<span style="font-size:12px;color:var(--text2);flex-shrink:0">My color:</span>'
    +'<div id="color-picker-wrap" style="display:flex;gap:6px;align-items:center">'+colorPicker+'</div>'
    +'<div id="my-color-preview" style="width:22px;height:22px;border-radius:50%;border:2px solid var(--text);margin-left:4px"></div>'
    +'<span style="font-size:11px;color:var(--text3);margin-left:4px">Click a colour to set yours</span>'
    +'</div>'
    +'<div id="tc-event-form" style="display:none;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px"></div>'
    +'<div class="cal-layout">'
    +'<div class="cal-wrap">'
    +'<div class="cal-header"><div class="cal-title">'+MN[m]+' '+y+'</div><div style="font-size:12px;color:var(--text3)">'+allActs.length+' event'+(allActs.length!==1?'s':'')+'</div></div>'
    +'<table class="cal-grid"><thead>'+dowRow+'</thead><tbody>'+rows+'</tbody></table>'
    +'</div>'
    +'<div class="act-sidebar"><div class="act-sidebar-head">Events in '+MN[m]+'</div>'+sideItems+'</div>'
    +'</div>';
}

function openTeamEventForm(dateStr){
  var form=document.getElementById('tc-event-form');
  if(!form)return;
  form.style.display='';
  var accOptions=accs().map(function(a){return'<option value="'+esc(a.name)+'">'+esc(a.name)+'</option>'}).join('');
  form.innerHTML='<div style="font-size:14px;font-weight:600;margin-bottom:12px">New Event'+(dateStr?' — '+dateStr:'')+'</div>'
    +'<div class="form-row">'
    +'<div><div class="field-label">Name (client)</div><input type="text" id="tc-name" placeholder="Client name"></div>'
    +'<div><div class="field-label">Work Type</div><select id="tc-wtype"><option value="Premove Survey">Premove Survey</option><option value="Meeting">Meeting</option><option value="Move">Move</option><option value="Document">Document</option></select></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div><div class="field-label">Date</div><input type="date" id="tc-date" value="'+(dateStr||todayStr())+'"></div>'
    +'<div><div class="field-label">Account type</div><select id="tc-acctype"><option value="private">Private</option><option value="company">Company</option></select></div>'
    +'</div>'
    +'<div class="form-row" id="tc-company-row" style="display:none">'
    +'<div style="flex:2"><div class="field-label">Company name</div><input type="text" id="tc-company" list="tc-company-list" placeholder="Company name or select existing"><datalist id="tc-company-list">'+accOptions+'</datalist></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div><div class="field-label">Origin address</div><input type="text" id="tc-origin" placeholder="Pickup address"></div>'
    +'<div><div class="field-label">Destination</div><input type="text" id="tc-dest" placeholder="Delivery address"></div>'
    +'</div>'
    +'<div class="form-row">'
    +'<div><div class="field-label">Phone number</div><input type="text" id="tc-phone" placeholder="+82 10-0000-0000"></div>'
    +'<div></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">'
    +'<button class="btn btn-sm" id="tc-form-cancel">Cancel</button>'
    +'<button class="btn btn-sm btn-primary" id="tc-form-save">Save</button>'
    +'</div>';

  var atSel=document.getElementById('tc-acctype');
  var compRow=document.getElementById('tc-company-row');
  atSel.addEventListener('change',function(){compRow.style.display=atSel.value==='company'?'':'none';});

  document.getElementById('tc-form-cancel').addEventListener('click',function(){form.style.display='none';form.innerHTML='';});
  document.getElementById('tc-form-save').addEventListener('click',async function(){
    var name=document.getElementById('tc-name').value.trim();
    var wtype=document.getElementById('tc-wtype').value;
    var date=document.getElementById('tc-date').value;
    var accType=document.getElementById('tc-acctype').value;
    var company=document.getElementById('tc-company')?(document.getElementById('tc-company').value.trim()):'';
    var origin=document.getElementById('tc-origin').value.trim();
    var dest=document.getElementById('tc-dest').value.trim();
    var phone=document.getElementById('tc-phone').value.trim();
    if(!name||!date){toast('Name and date are required.');return;}
    var userColor=await getUserColor();
    var evObj={
      name:name,workType:wtype,date:date,accountType:accType,
      origin:origin,destination:dest,phone:phone,
      userColor:userColor,userEmail:currentUser.email,userId:currentUser.uid,
      createdAt:serverTimestamp()
    };
    if(accType==='company'&&company){
      evObj.companyName=company;
      // auto-create/link account
      var match=accs().find(function(a){return a.name.trim().toLowerCase()===company.toLowerCase()});
      if(!match){
        var newAcc={name:company,type:'Company',pic:'',email:'',phone:phone||'',address:origin||'',comment:'Auto-created from Team Calendar',color:COLS[Math.floor(Math.random()*COLS.length)],leads:[]};
        var ar=await addDoc(collection(db,'accounts'),newAcc);
        match=Object.assign({},newAcc,{id:ar.id});
        DB.accounts[ar.id]=match;
        toast('Account "'+company+'" auto-created.');
      }
      evObj.accountId=match.id;
      // also create as lead
      var lr=await addDoc(collection(db,'leads'),{name:name,company:company,position:'',email:'',phone:phone||'',address:origin||'',comment:'From Team Calendar: '+wtype,color:COLS[Math.floor(Math.random()*COLS.length)],accounts:[match.id],actions:[{id:uid(),date:date,kind:'next',text:wtype+(dest?' → '+dest:''),done:false}]});
      await updateDoc(doc(db,'accounts',match.id),{leads:(match.leads||[]).concat([lr.id])});
    } else {
      // private -> "Private Clients" account
      evObj.companyName='Private Clients';
      var pvMatch=accs().find(function(a){return a.name==='Private Clients'});
      if(!pvMatch){
        var pvAcc={name:'Private Clients',type:'Private',pic:'',email:'',phone:'',address:'',comment:'Auto-created: holds all private client leads',color:'g',leads:[]};
        var pvr=await addDoc(collection(db,'accounts'),pvAcc);
        pvMatch=Object.assign({},pvAcc,{id:pvr.id});
        DB.accounts[pvr.id]=pvMatch;
        toast('Account "Private Clients" created.');
      }
      evObj.accountId=pvMatch.id;
      var pvlr=await addDoc(collection(db,'leads'),{name:name,company:'Private',position:'',email:'',phone:phone||'',address:origin||'',comment:'From Team Calendar: '+wtype,color:COLS[Math.floor(Math.random()*COLS.length)],accounts:[pvMatch.id],actions:[{id:uid(),date:date,kind:'next',text:wtype+(dest?' → '+dest:''),done:false}]});
      await updateDoc(doc(db,'accounts',pvMatch.id),{leads:(pvMatch.leads||[]).concat([pvlr.id])});
    }
    await addDoc(collection(db,'teamEvents'),evObj);
    toast('Event saved.');
    form.style.display='none';form.innerHTML='';
  });
}

/* ── call & email log ────────────────────────────────── */
function renderContacts(){
  var filter=S.contactFilter||'all';
  var allLogs=[];
  leads().forEach(function(l){
    (l.actions||[]).forEach(function(act){
      if(act.atype==='call'||act.atype==='email') allLogs.push({lead:l,action:act});
    });
  });
  allLogs.sort(function(a,b){return a.action.date<b.action.date?1:-1});
  var filtered=filter==='all'?allLogs:allLogs.filter(function(x){return x.action.atype===filter});

  var copyStr=filtered.map(function(item){
    return item.action.date+' | '+(item.action.atype==='call'?'Call':'Email')+' | '+item.lead.name+' | '+item.action.text;
  }).join('\n');

  var filterBar='<div style="display:flex;gap:6px;margin-bottom:14px">'
    +'<button class="btn btn-sm '+(filter==='all'?'btn-primary':'')+'" data-contact-filter="all">All ('+allLogs.length+')</button>'
    +'<button class="btn btn-sm '+(filter==='call'?'btn-primary':'')+'" data-contact-filter="call">Calls ('+allLogs.filter(function(x){return x.action.atype==='call'}).length+')</button>'
    +'<button class="btn btn-sm '+(filter==='email'?'btn-primary':'')+'" data-contact-filter="email">Emails ('+allLogs.filter(function(x){return x.action.atype==='email'}).length+')</button>'
    +'</div>';

  var rows=filtered.length?filtered.map(function(item){
    var lead=item.lead,act=item.action;
    var accNames=(lead.accounts||[]).map(function(id){return DB.accounts[id]&&DB.accounts[id].name}).filter(Boolean).join(', ')||'Unlinked';
    var isCall=act.atype==='call';
    var iconCls=isCall?'ti-phone':'ti-mail';
    var bg=isCall?'#E6F1FB':'#EAF3DE';
    var col=isCall?'#185FA5':'#3B6D11';
    return '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:5px">'
      +'<div style="width:34px;height:34px;border-radius:50%;background:'+bg+';color:'+col+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti '+iconCls+'" style="font-size:16px"></i></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:13px;font-weight:600;color:var(--text)">'+esc(lead.name)+'</div>'
      +'<div style="font-size:12px;color:var(--text2);margin-top:1px">'+esc(accNames)+' \u00b7 '+esc(act.date)+'</div>'
      +'<div style="font-size:13px;color:var(--text);margin-top:3px">'+esc(act.text)+'</div>'
      +'</div>'
      +'<span style="font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;background:'+bg+';color:'+col+';flex-shrink:0">'+(isCall?'Call':'Email')+'</span>'
      +'</div>';
  }).join(''):'<div class="empty">No '+(filter==='all'?'call or email':filter)+' logs yet.<br>Add actions with type Call or Email from a Lead.</div>';

  return '<div class="page-header"><div class="page-title">Call &amp; Email Log</div>'
    +'<button class="btn btn-sm btn-primary" id="copy-log-btn"><i class="ti ti-copy"></i> Copy all</button>'
    +'</div>'
    +'<div id="copy-text-store" style="display:none">'+esc(copyStr)+'</div>'
    +filterBar
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:10px">'+filtered.length+' record'+(filtered.length!==1?'s':'')+'</div>'
    +rows;
}

/* ── export CSV ────────────────────────────────────── */
function exportCSV(){
  function e(v){return'"'+String(v||'').replace(/"/g,'""')+'"'}
  var csv='GLS GB - CRM Export\r\n\r\n';
  csv+='=== ACCOUNTS ===\r\nID,Company,Type,PIC,Email,Phone,Address,Comment,Linked Leads\r\n';
  accs().forEach(function(a){csv+=[a.id,a.name,a.type,a.pic,a.email,a.phone,a.address,a.comment,(a.leads||[]).length].map(e).join(',')+'\r\n';});
  csv+='\r\n=== LEADS ===\r\nID,Name,Company,Position,Email,Phone,Address,Comment,Linked Accounts\r\n';
  leads().forEach(function(l){var an=(l.accounts||[]).map(function(id){return DB.accounts[id]&&DB.accounts[id].name}).filter(Boolean).join('; ');csv+=[l.id,l.name,l.company,l.position,l.email,l.phone,l.address,l.comment,an||'Unlinked'].map(e).join(',')+'\r\n';});
  csv+='\r\n=== ACTIONS ===\r\nLead ID,Lead Name,Date,Type,Done,Description\r\n';
  leads().forEach(function(l){(l.actions||[]).slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(act){csv+=[l.id,l.name,act.date,act.kind==='past'?'Past action':act.kind==='current'?'Current action':'Follow-up',act.done?'Yes':'No',act.text].map(e).join(',')+'\r\n';});});
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='GLS_GB_CRM_Export_'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('CSV exported.');
}
</script>
