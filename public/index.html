<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLS GB · CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#ffffff;--bg2:#f5f5f3;--bg3:#efefed;--text:#1a1a18;--text2:#6b6b67;--text3:#a0a09a;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);--radius:8px;--radius-lg:12px;--info-bg:#E6F1FB;--info-text:#185FA5;--danger-bg:#FCEBEB;--danger-text:#A32D2D;--success-bg:#EAF3DE;--success-text:#3B6D11;--warn-bg:#FAEEDA;--warn-text:#854F0B;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2b;--text:#f0f0ec;--text2:#a0a09a;--text3:#6b6b67;--border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.20);--info-bg:#042C53;--info-text:#85B7EB;--danger-bg:#501313;--danger-text:#F09595;--success-bg:#173404;--success-text:#97C459;--warn-bg:#412402;--warn-text:#FAC775;}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg3);color:var(--text);font-size:14px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg3);padding:20px}
.auth-card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:32px;width:100%;max-width:360px}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.auth-logo-icon{width:38px;height:38px;background:var(--text);border-radius:9px;display:flex;align-items:center;justify-content:center}
.auth-logo-icon i{font-size:20px;color:var(--bg)}
.auth-title{font-size:17px;font-weight:600}
.auth-sub{font-size:12px;color:var(--text3);margin-top:2px}
.auth-err{background:var(--danger-bg);color:var(--danger-text);border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:14px;display:none}
.auth-err.show{display:block}
.app{display:flex;flex-direction:column;height:100vh}
.header{background:var(--bg);border-bottom:.5px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:28px;height:28px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center}
.brand-logo i{font-size:16px;color:var(--bg)}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--text3);margin-left:2px}
.header-r{display:flex;gap:8px;align-items:center}
.user-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:4px 10px;background:var(--bg2);border-radius:20px;border:.5px solid var(--border)}
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--bg);border-right:.5px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;width:100%;text-align:left}
.nav-item:hover,.nav-item.active{background:var(--bg2);color:var(--text)}
.nav-item i{font-size:17px}
.nav-badge{margin-left:auto;font-size:11px;font-weight:500;background:var(--bg3);color:var(--text2);padding:1px 7px;border-radius:20px}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;padding:10px 10px 4px;margin-top:4px}
.main{flex:1;overflow-y:auto;padding:20px}
.content{max-width:960px;margin:0 auto}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:13px;font-weight:500;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--bg);color:var(--text);cursor:pointer;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--text);color:var(--bg);border-color:transparent}
.btn-primary:hover{opacity:.86}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-danger{color:var(--danger-text);border-color:var(--danger-text)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-full{width:100%;justify-content:center;padding:10px}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;display:inline-block}
.bd-blue{background:var(--info-bg);color:var(--info-text)}
.bd-gray{background:var(--bg3);color:var(--text2)}
.bd-amber{background:var(--warn-bg);color:var(--warn-text)}
.bd-red{background:var(--danger-bg);color:var(--danger-text)}
.bd-green{background:var(--success-bg);color:var(--success-text)}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.card-head{padding:14px 18px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-head-l{display:flex;align-items:center;gap:10px}
.card-body{padding:16px 18px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;margin-bottom:5px;transition:border-color .12s}
.list-item:hover{border-color:var(--border2)}
.av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.av-r{border-radius:50%}
.av-lg{width:40px;height:40px;border-radius:9px;font-size:13px}
.av-b{background:#E6F1FB;color:#0C447C}.av-t{background:#E1F5EE;color:#085041}
.av-a{background:#FAEEDA;color:#633806}.av-c{background:#FAECE7;color:#712B13}
.av-g{background:#F1EFE8;color:#444441}.av-p{background:#EEEDFE;color:#3C3489}
@media(prefers-color-scheme:dark){
.av-b{background:#0C447C;color:#B5D4F4}.av-t{background:#085041;color:#9FE1CB}
.av-a{background:#633806;color:#FAC775}.av-c{background:#712B13;color:#F5C4B3}
.av-g{background:#444441;color:#D3D1C7}.av-p{background:#3C3489;color:#CECBF6}}
.sl{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.ir{display:flex;gap:8px;padding:4px 0;font-size:13px}
.ik{color:var(--text2);width:86px;flex-shrink:0;font-size:12px}
.iv{color:var(--text);flex:1;word-break:break-all}
.iv-link{color:var(--info-text)}
.divider{height:.5px;background:var(--border);margin:12px 0}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:5px}
.metric-val{font-size:24px;font-weight:600}
.metric-val.danger{color:var(--danger-text)}
.alert-card{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:5px;cursor:pointer;transition:border-color .12s}
.alert-card:hover{border-color:var(--border2)}
.alert-card.overdue{border-left:3px solid #E24B4A;border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.today{border-left:3px solid #EF9F27;border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.upcoming{border-left:3px solid #378ADD;border-radius:0 var(--radius-lg) var(--radius-lg) 0}
.alert-card.done{border-left:3px solid #5DAD82;border-radius:0 var(--radius-lg) var(--radius-lg) 0;opacity:.6}
.tl-item{display:flex;gap:12px;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-lw{display:flex;flex-direction:column;align-items:center;width:16px;flex-shrink:0}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex-shrink:0}
.tl-dot-past{background:var(--bg3);border:2px solid var(--text3)}
.tl-dot-cur{background:#E1F5EE;border:2px solid #1D9E75}
.tl-dot-next{background:#E6F1FB;border:2px solid #378ADD}
.tl-dot-done{background:#E1F5EE;border:2px solid #5DAD82}
.tl-vline{width:1px;background:var(--border);flex:1;min-height:10px;margin-top:3px}
.tl-c{flex:1;min-width:0}
.tl-date{font-size:11px;color:var(--text3);margin-bottom:1px}
.tkind{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;display:inline-block;margin-top:3px}
.kind-past{background:var(--bg3);color:var(--text2)}
.kind-current{background:#E1F5EE;color:#0F6E56}
.kind-next{background:#E6F1FB;color:#185FA5}
.kind-done{background:#E1F5EE;color:#5DAD82}
@media(prefers-color-scheme:dark){.kind-current{background:#04342C;color:#9FE1CB}.kind-next{background:#042C53;color:#85B7EB}}
.chip{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:var(--bg2);border-radius:var(--radius);border:.5px solid var(--border);cursor:pointer;margin-bottom:5px;transition:border-color .12s}
.chip:hover{border-color:var(--border2)}
.field-label{font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:10px}
.field-label:first-of-type{margin-top:0}
input[type=text],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;padding:8px 10px;font-size:13px;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#378ADD;box-shadow:0 0 0 2px rgba(55,138,221,.15)}
textarea{resize:vertical;min-height:56px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--bg);border-radius:var(--radius-lg);border:.5px solid var(--border);padding:22px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.acc-ck-list{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:8px 10px;max-height:100px;overflow-y:auto}
.acc-ck-list label{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0;cursor:pointer}
.act-form{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:10px}
.act-form .field-label{margin-top:8px}
.act-form .field-label:first-of-type{margin-top:0}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:17px;font-weight:600}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:12px}
.back-btn:hover{color:var(--text)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:18px}
.section-head:first-child{margin-top:0}
.empty{text-align:center;padding:2rem;font-size:13px;color:var(--text3)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;background:var(--bg3)}
.spinner{width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cal-layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.cal-wrap{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:.5px solid var(--border)}
.cal-title{font-size:15px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:10px 4px;letter-spacing:.05em;text-transform:uppercase}
.cal-cell{min-height:82px;border-top:.5px solid var(--border);border-right:.5px solid var(--border);padding:6px;vertical-align:top}
.cal-cell:nth-child(7n){border-right:none}
.cal-day-num{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:3px}
.cal-day-num.today-num{width:22px;height:22px;background:var(--text);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.cal-day-num.other-month{color:var(--text3)}
.cal-event{font-size:10px;font-weight:500;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-next{background:#E6F1FB;color:#185FA5}
.ev-current{background:#E1F5EE;color:#0F6E56}
.ev-overdue{background:#FCEBEB;color:#A32D2D}
.ev-done{background:#F1EFE8;color:#888780;text-decoration:line-through}
@media(prefers-color-scheme:dark){
.ev-next{background:#042C53;color:#85B7EB}
.ev-current{background:#04342C;color:#9FE1CB}
.ev-overdue{background:#501313;color:#F09595}}
.act-sidebar{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.act-sidebar-head{padding:12px 14px;border-bottom:.5px solid var(--border);font-size:13px;font-weight:600}
.act-sidebar-item{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-bottom:.5px solid var(--border)}
.act-sidebar-item:last-child{border-bottom:none}
.act-sidebar-item:hover{background:var(--bg2)}
.act-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .1s}
.act-check.checked{background:var(--text);border-color:var(--text)}
.act-check.checked::after{content:'checkmark';font-family:'tabler-icons';font-size:11px;color:var(--bg)}
.user-card{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.user-card-info{display:flex;align-items:center;gap:10px}
.user-av{width:34px;height:34px;border-radius:50%;background:var(--info-bg);color:var(--info-text);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.admin-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:#EEEDFE;color:#3C3489;margin-left:6px}
@media(prefers-color-scheme:dark){.admin-badge{background:#3C3489;color:#CECBF6}}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:2rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upload-zone:hover,.upload-zone.drag{border-color:#378ADD;background:var(--info-bg)}
.upload-zone i{font-size:32px;color:var(--text3);display:block;margin-bottom:8px}
@media print{
.sidebar,.header,.btn,.back-btn,.modal-overlay,.toast,.no-print{display:none!important}
.main{padding:0!important}.content{max-width:100%!important}
body{background:#fff!important}.cal-layout{grid-template-columns:1fr 260px!important}
.app{height:auto!important}.body{overflow:visible!important}.main{overflow:visible!important}}
@media(max-width:700px){.sidebar{display:none}.metric-grid{grid-template-columns:repeat(2,1fr)}.cal-layout{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3)">Connecting...</div>
</div>

<div class="auth-wrap" id="auth-wrap" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="ti ti-briefcase"></i></div>
      <div><div class="auth-title">GLS GB · CRM</div><div class="auth-sub">Global Business Management</div></div>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <div class="field-label" style="margin-top:0">Email</div>
    <input type="email" id="login-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="field-label" style="margin-top:10px">Password</div>
    <input type="password" id="login-pw" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="doLogin()">
      <i class="ti ti-login"></i> Sign In
    </button>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:16px">Access restricted to authorised accounts only.</div>
  </div>
</div>

<div class="app" id="app-wrap" style="display:none">
  <div class="header no-print">
    <div class="brand">
      <div class="brand-logo"><i class="ti ti-briefcase"></i></div>
      <div><span class="brand-name">GLS GB</span><span class="brand-sub">CRM</span></div>
    </div>
    <div class="header-r">
      <div class="user-chip"><i class="ti ti-user" style="font-size:13px"></i><span id="user-email-display"></span></div>
      <button class="btn btn-sm" id="export-btn"><i class="ti ti-download"></i> Export CSV</button>
      <button class="btn btn-sm" onclick="window.print()"><i class="ti ti-printer"></i> Print</button>
      <button class="btn btn-sm btn-primary" id="add-main-btn" style="display:none"><i class="ti ti-plus"></i><span id="add-label">Add</span></button>
      <button class="btn btn-sm" onclick="doLogout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="body">
    <div class="sidebar no-print">
      <div class="nav-section">Navigation</div>
      <button class="nav-item active" data-tab="dashboard"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
      <button class="nav-item" data-tab="calendar"><i class="ti ti-calendar"></i>Calendar</button>
      <button class="nav-item" data-tab="accounts"><i class="ti ti-building"></i>Accounts<span class="nav-badge" id="nb-acc">0</span></button>
      <button class="nav-item" data-tab="leads"><i class="ti ti-users"></i>Leads<span class="nav-badge" id="nb-leads">0</span></button>
      <div class="nav-section" style="margin-top:auto">Admin</div>
      <button class="nav-item" id="admin-btn" data-tab="admin" style="display:none"><i class="ti ti-shield"></i>User Mgmt</button>
      <div class="nav-section">Data</div>
      <button class="nav-item" id="sb-export"><i class="ti ti-file-spreadsheet"></i>Export CSV</button>
      <button class="nav-item" data-tab="import"><i class="ti ti-upload"></i>Import Leads</button>
    </div>
    <div class="main"><div class="content" id="main-content"></div></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,getDocs,onSnapshot,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBeKJhlrZa0QO53vGEECQ_Op_Yzg5QIIJ4",
  authDomain:"gls-bd-crm.firebaseapp.com",
  projectId:"gls-bd-crm",
  storageBucket:"gls-bd-crm.firebasestorage.app",
  messagingSenderId:"1099159791944",
  appId:"1:1099159791944:web:5b6d934f80012f85f96b7d"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

const CC={b:'av-b',t:'av-t',a:'av-a',c:'av-c',g:'av-g',p:'av-p'};
const COLS=['b','t','a','c','g','p'];
function uid(){return Math.random().toString(36).slice(2,9)}
function ini(s){return(s||'?').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function daysFrom(d){return Math.floor((new Date(d)-new Date(todayStr()))/864e5)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function showErr(msg){const e=document.getElementById('auth-err');e.textContent=msg;e.classList.add('show')}
function clearErr(){const e=document.getElementById('auth-err');if(e)e.classList.remove('show')}

let currentUser=null,isAdmin=false;
let DB={accounts:{},leads:{}};
let unsubAcc=null,unsubLeads=null;
let S={tab:'dashboard',view:'list',accId:null,leadId:null,fromAcc:null,calYear:new Date().getFullYear(),calMonth:new Date().getMonth()};

onAuthStateChanged(auth,async user=>{
  document.getElementById('loading').style.display='none';
  if(user){
    const ud=await getDoc(doc(db,'users',user.uid));
    if(!ud.exists()){
      await signOut(auth);
      document.getElementById('auth-wrap').style.display='flex';
      showErr('Access denied. Contact your administrator.');
      return;
    }
    currentUser=user;
    isAdmin=ud.data().role==='admin';
    document.getElementById('user-email-display').textContent=user.email;
    document.getElementById('admin-btn').style.display=isAdmin?'':'none';
    document.getElementById('auth-wrap').style.display='none';
    document.getElementById('app-wrap').style.display='flex';
    startListeners();
  }else{
    currentUser=null;isAdmin=false;
    stopListeners();
    document.getElementById('app-wrap').style.display='none';
    document.getElementById('auth-wrap').style.display='flex';
  }
});

window.doLogin=async function(){
  clearErr();
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  if(!email||!pw){showErr('Please enter email and password.');return}
  try{await signInWithEmailAndPassword(auth,email,pw);}
  catch(e){
    const c=e.code;
    if(['auth/user-not-found','auth/wrong-password','auth/invalid-credential'].includes(c))showErr('Invalid email or password.');
    else if(c==='auth/too-many-requests')showErr('Too many attempts. Try again later.');
    else showErr('Sign-in failed. Please try again.');
  }
};
window.doLogout=async function(){await signOut(auth);};

function startListeners(){
  unsubAcc=onSnapshot(collection(db,'accounts'),snap=>{
    DB.accounts={};
    snap.forEach(d=>{DB.accounts[d.id]={...d.data(),id:d.id}});
    render();
  });
  unsubLeads=onSnapshot(collection(db,'leads'),snap=>{
    DB.leads={};
    snap.forEach(d=>{DB.leads[d.id]={...d.data(),id:d.id}});
    render();
  });
}
function stopListeners(){if(unsubAcc)unsubAcc();if(unsubLeads)unsubLeads();}
function accs(){return Object.values(DB.accounts)}
function leads(){return Object.values(DB.leads)}

function render(){
  const el=document.getElementById('main-content');
  if(!el)return;
  updateBadges();
  const addBtn=document.getElementById('add-main-btn');
  const addLabel=document.getElementById('add-label');
  document.querySelectorAll('.nav-item[data-tab]').forEach(n=>n.classList.toggle('active',n.dataset.tab===S.tab));
  if(S.view==='acc_detail'){addBtn.style.display='none';el.innerHTML=renderAccDetail();}
  else if(S.view==='lead_detail'){addBtn.style.display='none';el.innerHTML=renderLeadDetail();}
  else{
    if(S.tab==='accounts'){addBtn.style.display='';addLabel.textContent='Add Account';}
    else if(S.tab==='leads'){addBtn.style.display='';addLabel.textContent='Add Lead';}
    else{addBtn.style.display='none';}
    if(S.tab==='dashboard')el.innerHTML=renderDashboard();
    else if(S.tab==='calendar')el.innerHTML=renderCalendar();
    else if(S.tab==='accounts')el.innerHTML=renderAccList();
    else if(S.tab==='leads')el.innerHTML=renderLeadList();
    else if(S.tab==='import')el.innerHTML=renderImport();
    else if(S.tab==='admin'){renderAdminAsync(el);return;}
  }
  attachEvents();
}

function updateBadges(){
  document.getElementById('nb-acc').textContent=accs().length;
  document.getElementById('nb-leads').textContent=leads().length;
}

function getAlerts(){
  const out=[];
  leads().forEach(l=>(l.actions||[]).forEach(act=>{
    if(act.kind==='past')return;
    const diff=daysFrom(act.date);
    let u=act.done?'done':diff<0?'overdue':diff===0?'today':diff<=7?'upcoming':null;
    if(u)out.push({lead:l,action:act,urgency:u,diff:act.done?9999:diff});
  }));
  return out.sort((a,b)=>a.diff-b.diff);
}

  const alerts=getAlerts();

        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:13px;font-weight:600">${lead.name}</span>

    </div>`;

  const pendingHTML=pending.length?pending.map(makeCard).join('')
    :`<div style="padding:12px;text-align:center;font-size:13px;color:var(--text3);background:var(--bg2);border-radius:var(--radius)">No pending actions — all clear. ✓</div>`;

function renderCalendar(){
  const y=S.calYear,m=S.calMonth;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();
  const tf=todayStr();
  const events={},allActs=[];
  leads().forEach(l=>(l.actions||[]).forEach(act=>{
    if(!act.date)return;
    const prefix=`${y}-${String(m+1).padStart(2,'0')}`;
    if(act.date.startsWith(prefix)){
      if(!events[act.date])events[act.date]=[];
      events[act.date].push({lead:l,action:act});
      allActs.push({lead:l,action:act,date:act.date});
    }
  }));
  allActs.sort((a,b)=>a.date<b.date?-1:1);

  let cells='';let cc=0;
  for(let i=firstDay-1;i>=0;i--){cells+=`<div class="cal-cell"><div class="cal-day-num other-month">${daysInPrev-i}</div></div>`;cc++;}
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===tf;
    const evs=events[ds]||[];
    const evHTML=evs.slice(0,3).map(({lead,action})=>{
      let cls=action.done?'ev-done':daysFrom(ds)<0?'ev-overdue':action.kind==='current'?'ev-current':'ev-next';
      return`<div class="cal-event ${cls}" title="${lead.name}: ${action.text}">${lead.name}</div>`;
    }).join('')+(evs.length>3?`<div style="font-size:10px;color:var(--text3);padding:1px 4px">+${evs.length-3} more</div>`:'');
    cells+=`<div class="cal-cell"><div class="cal-day-num${isToday?' today-num':''}">${d}</div>${evHTML}</div>`;cc++;
  }
  const rem=cc%7===0?0:7-(cc%7);
  for(let d=1;d<=rem;d++){cells+=`<div class="cal-cell"><div class="cal-day-num other-month">${d}</div></div>`;}

  const sideItems=allActs.length?allActs.map(({lead,action,date})=>{
    const diff=daysFrom(date);
    let color=action.done?'var(--text3)':diff<0?'var(--danger-text)':diff===0?'var(--warn-text)':'var(--info-text)';
    let bg=action.done?'var(--bg3)':diff<0?'var(--danger-bg)':diff===0?'var(--warn-bg)':'var(--info-bg)';
    return`<div class="act-sidebar-item">
      <div class="act-check ${action.done?'checked':''}" data-toggle="${lead.id}|${action.id}" style="font-size:11px;color:var(--bg)">
        ${action.done?'<i class="ti ti-check" style="font-size:11px"></i>':''}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:500;color:${color};${action.done?'text-decoration:line-through':''}">${action.text}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:1px">${lead.name} · ${date}</div>
        <div style="display:inline-block;font-size:10px;font-weight:500;padding:1px 6px;border-radius:20px;background:${bg};color:${color};margin-top:2px">${action.kind==='past'?'Past':action.kind==='current'?'Current':'Follow-up'}</div>
      </div>
    </div>`;
  }).join(''):`<div class="empty">No actions this month.</div>`;

  return`<div class="page-header">
    <div class="page-title">${MN[m]} ${y}</div>
    <div style="display:flex;gap:6px" class="no-print">
      <button class="btn btn-sm" id="cal-prev"><i class="ti ti-chevron-left"></i></button>
      <button class="btn btn-sm" id="cal-today">Today</button>
      <button class="btn btn-sm" id="cal-next"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>
  <div class="cal-layout">
    <div class="cal-wrap">
      <div class="cal-header">
        <div class="cal-title">${MN[m]} ${y}</div>
        <div style="font-size:12px;color:var(--text3)">${allActs.length} action${allActs.length!==1?'s':''}</div>
      </div>
      <div class="cal-grid">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div class="act-sidebar">
      <div class="act-sidebar-head">Actions in ${MN[m]}</div>
      ${sideItems}
    </div>
  </div>`;
}

let importRows=[];
function processFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){const r=new FileReader();r.onload=e=>parseCSV(e.target.result);r.readAsText(file,'utf-8');}
  else if(ext==='xlsx'||ext==='xls'){const r=new FileReader();r.onload=e=>parseXLSX(e.target.result);r.readAsArrayBuffer(file);}
  else toast('Please upload .csv, .xlsx, or .xls');
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2){toast('File is empty.');return;}
  const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
  const rows=lines.slice(1).map(line=>{
    const vals=[];let cur='',inq=false;
    for(let i=0;i<line.length;i++){if(line[i]==='"')inq=!inq;else if(line[i]===','&&!inq){vals.push(cur.trim());cur='';}else cur+=line[i];}
    vals.push(cur.trim());
    const obj={};headers.forEach((h,i)=>{obj[h]=(vals[i]||'').trim();});
    return obj;
  }).filter(r=>r.name);
  showPreview(rows);
}
function parseXLSX(buf){
  if(!window.XLSX){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>doXLSX(buf);
    document.head.appendChild(s);
  }else doXLSX(buf);
}
function doXLSX(buf){
  try{
    const wb=XLSX.read(buf,{type:'arraybuffer'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(ws,{defval:''});
    const rows=json.map(r=>{const o={};Object.keys(r).forEach(k=>{o[k.toLowerCase().trim()]=String(r[k]).trim();});return o;}).filter(r=>r.name);
    showPreview(rows);
  }catch(e){toast('Failed to read Excel file.');}
}
function showPreview(rows){
  importRows=rows;
  const existing=new Set(leads().map(l=>l.email?.toLowerCase()).filter(Boolean));
  const preview=document.getElementById('import-preview');
  const table=document.getElementById('preview-table');
  if(!preview||!table)return;
  preview.style.display='';
  const fields=['name','company','position','email','phone','address','comment'];
  table.innerHTML=`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="background:var(--bg2)">${fields.map(f=>`<th style="padding:7px 10px;text-align:left;border:.5px solid var(--border);font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-size:10px">${f}</th>`).join('')}<th style="padding:7px 10px;border:.5px solid var(--border)">Status</th></tr></thead>
    <tbody>${rows.map(r=>{
      const skip=existing.has((r.email||'').toLowerCase());
      return`<tr style="${skip?'opacity:.45':''}">
        ${fields.map(f=>`<td style="padding:6px 10px;border:.5px solid var(--border)">${r[f]||'—'}</td>`).join('')}
        <td style="padding:6px 10px;border:.5px solid var(--border)">${skip?`<span class="badge bd-gray">Skip</span>`:`<span class="badge bd-green">New</span>`}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
  toast(`${rows.length} rows found. Review and confirm.`);
}
async function confirmImport(){
  const existing=new Set(leads().map(l=>l.email?.toLowerCase()).filter(Boolean));
  let count=0,accCreated=0;
  for(const r of importRows){
    if(existing.has((r.email||'').toLowerCase()))continue;
    const companyName=(r.company||'').trim();
    let accountIds=[];
    if(companyName){
      let match=accs().find(a=>a.name.trim().toLowerCase()===companyName.toLowerCase());
      if(!match){
        const newAccObj={name:companyName,type:'Company',pic:'',email:'',phone:'',address:'',comment:'Auto-created from import',color:COLS[Math.floor(Math.random()*COLS.length)],leads:[]};
        const ar=await addDoc(collection(db,'accounts'),newAccObj);
        match={...newAccObj,id:ar.id};
        DB.accounts[ar.id]=match;
        accCreated++;
      }
      accountIds=[match.id];
    }
    const lr=await addDoc(collection(db,'leads'),{name:r.name||'',company:r.company||'',position:r.position||'',email:r.email||'',phone:r.phone||'',address:r.address||'',comment:r.comment||'',color:COLS[Math.floor(Math.random()*COLS.length)],accounts:accountIds,actions:[]});
    if(accountIds.length){
      const acc=DB.accounts[accountIds[0]];
      await updateDoc(doc(db,'accounts',accountIds[0]),{leads:[...(acc.leads||[]),lr.id]});
    }
    count++;
  }
  toast(`${count} lead${count!==1?'s':''} imported${accCreated?`, ${accCreated} account(s) auto-created`:''}.`);
  importRows=[];S.tab='leads';S.view='list';render();
}

      const name=q('#f-name').value.trim();if(!name){alert('Company name is required.');return;}
      const obj={name,type:q('#f-type').value.trim(),pic:q('#f-pic').value.trim(),email:q('#f-email').value.trim(),phone:q('#f-phone').value.trim(),address:q('#f-address').value.trim(),comment:q('#f-comment').value.trim(),color:data?.color||COLS[Math.floor(Math.random()*COLS.length)],leads:data?.leads||[]};
      if(type==='add_account'){const r=await addDoc(collection(db,'accounts'),obj);S.accId=r.id;}
      else{await updateDoc(doc(db,'accounts',data.id),obj);S.accId=data.id;}
      closeModal();
      if(type==='edit_account')S.view='acc_detail';else{S.tab='accounts';S.view='list';}
      toast('Account saved.');
    };
  }
  if(type==='add_lead'||type==='edit_lead'){
    const d=data||{};
    const selIds=d.accounts||[];
    const checks=accs().map(a=>`<label><input type="checkbox" class="acc-ck" value="${a.id}" ${selIds.includes(a.id)?'checked':''}> ${a.name}</label>`).join('');
    body.innerHTML=`<div class="modal-title">${type==='add_lead'?'New Lead':'Edit Lead'}</div>
      <div class="field-label">Full name *</div><input id="f-name" type="text" value="${d.name||''}">
      <div class="field-label">Company</div><input id="f-company" type="text" value="${d.company||''}">
      <div class="field-label">Position</div><input id="f-position" type="text" value="${d.position||''}">
      <div class="field-label">Email</div><input id="f-email" type="text" value="${d.email||''}">
      <div class="field-label">Phone</div><input id="f-phone" type="text" value="${d.phone||''}">
      <div class="field-label">Address</div><input id="f-address" type="text" value="${d.address||''}">
      <div class="field-label">Comment</div><textarea id="f-comment">${d.comment||''}</textarea>
      <div class="field-label">Link to Accounts</div>
      <div class="acc-ck-list">${checks||'<span style="font-size:12px;color:var(--text3)">No accounts yet</span>'}</div>
      <div class="modal-footer"><button class="btn" id="m-cancel">Cancel</button><button class="btn btn-primary" id="m-save">Save</button></div>`;
    q('#m-cancel').onclick=closeModal;
    q('#m-save').onclick=async()=>{
      const name=q('#f-name').value.trim();if(!name){alert('Name is required.');return;}
      const selAccIds=[...document.querySelectorAll('.acc-ck:checked')].map(el=>el.value);
      const obj={name,company:q('#f-company').value.trim(),position:q('#f-position').value.trim(),email:q('#f-email').value.trim(),phone:q('#f-phone').value.trim(),address:q('#f-address').value.trim(),comment:q('#f-comment').value.trim(),color:data?.color||COLS[Math.floor(Math.random()*COLS.length)],accounts:selAccIds,actions:data?.actions||[]};
      let leadId=data?.id;
      if(type==='add_lead'){const r=await addDoc(collection(db,'leads'),obj);leadId=r.id;}
      else await updateDoc(doc(db,'leads',data.id),obj);

      // Auto-create / auto-link account based on company name
      const companyName=obj.company.trim();
      if(companyName){
        let match=accs().find(a=>a.name.trim().toLowerCase()===companyName.toLowerCase());
        if(!match){
          const newAccObj={name:companyName,type:'Company',pic:'',email:'',phone:'',address:'',comment:'Auto-created from lead: '+obj.name,color:COLS[Math.floor(Math.random()*COLS.length)],leads:[]};
          const r=await addDoc(collection(db,'accounts'),newAccObj);
          match={...newAccObj,id:r.id};
          DB.accounts[r.id]=match;
          toast(`Account "${companyName}" auto-created.`);
        }
        if(!selAccIds.includes(match.id)) selAccIds.push(match.id);
      }

      for(const a of accs()){
        const had=(a.leads||[]).includes(leadId),has=selAccIds.includes(a.id);
        if(has&&!had)await updateDoc(doc(db,'accounts',a.id),{leads:[...(a.leads||[]),leadId]});
        if(!has&&had)await updateDoc(doc(db,'accounts',a.id),{leads:(a.leads||[]).filter(id=>id!==leadId)});
      }
      // Persist the (possibly auto-linked) account list on the lead itself
      if(!(obj.accounts.length===selAccIds.length && obj.accounts.every(id=>selAccIds.includes(id)))){
        await updateDoc(doc(db,'leads',leadId),{accounts:selAccIds});
      }
      closeModal();S.leadId=leadId;
      if(type==='edit_lead')S.view='lead_detail';else{S.tab='leads';S.view='list';}
      toast('Lead saved.');
    };
  }
}
function closeModal(){document.getElementById('modal-overlay').style.display='none';}

function exportCSV(){
  const e=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  let csv='GLS GB - CRM Export\r\n\r\n';
  csv+='=== ACCOUNTS ===\r\nID,Company,Type,PIC,Email,Phone,Address,Comment,Linked Leads\r\n';
  accs().forEach(a=>{csv+=[a.id,a.name,a.type,a.pic,a.email,a.phone,a.address,a.comment,(a.leads||[]).length].map(e).join(',')+'\r\n';});
  csv+='\r\n=== LEADS ===\r\nID,Name,Company,Position,Email,Phone,Address,Comment,Linked Accounts\r\n';
  leads().forEach(l=>{const an=(l.accounts||[]).map(id=>DB.accounts[id]?.name).filter(Boolean).join('; ');csv+=[l.id,l.name,l.company,l.position,l.email,l.phone,l.address,l.comment,an||'Unlinked'].map(e).join(',')+'\r\n';});
  csv+='\r\n=== ACTIONS ===\r\nLead ID,Lead Name,Date,Type,Done,Description\r\n';
  leads().forEach(l=>{[...(l.actions||[])].sort((a,b)=>a.date<b.date?-1:1).forEach(act=>{csv+=[l.id,l.name,act.date,act.kind==='past'?'Past action':act.kind==='current'?'Current action':'Follow-up',act.done?'Yes':'No',act.text].map(e).join(',')+'\r\n';});});
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='GLS_GB_CRM_Export_'+todayStr()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('CSV exported.');
}
</script>
</body>
